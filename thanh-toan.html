<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Thanh toán — Fashion Store</title>

  <link rel="stylesheet" href="css/style.css" />

  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .checkout-box {
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .checkout-box h2 {
      margin-top: 0;
    }

    .checkout-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .checkout-form label {
      font-weight: 600;
      margin-top: 8px;
    }

    .checkout-form input,
    .checkout-form textarea,
    .checkout-form select {
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font: inherit;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .checkout-total {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 700;
      color: #ff6b6b;
    }

    @media (max-width: 700px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="site-header">
  <div class="container">

    <div class="logo">
      Fashion Store
    </div>

    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html">
        Giỏ hàng <span id="cart-count">0</span>
      </a>
      <a href="lich-su-don-hang.html">Đơn hàng</a>
    </nav>

  </div>
</header>


<main class="container">

  <h1>THANH TOÁN</h1>

  <div class="checkout-layout">

    <!-- THÔNG TIN NHẬN HÀNG -->

    <div class="checkout-box">

      <h2>Thông tin nhận hàng</h2>

      <form id="checkout-form" class="checkout-form">

        <label for="customer-name">
          Họ và tên
        </label>

        <input
          id="customer-name"
          name="name"
          type="text"
          required
          placeholder="Nhập họ và tên"
        />


        <label for="customer-phone">
          Số điện thoại
        </label>

        <input
          id="customer-phone"
          name="phone"
          type="tel"
          required
          placeholder="Nhập số điện thoại"
        />


        <label for="customer-address">
          Địa chỉ nhận hàng
        </label>

        <textarea
          id="customer-address"
          name="address"
          rows="4"
          required
          placeholder="Nhập địa chỉ nhận hàng"
        ></textarea>


        <label for="payment-method">
          Phương thức thanh toán
        </label>

        <select
          id="payment-method"
          name="payment"
          required
        >
          <option value="COD">
            Thanh toán khi nhận hàng (COD)
          </option>

          <option value="BANK">
            Chuyển khoản ngân hàng
          </option>
        </select>


        <button class="btn" type="submit">
          ĐẶT HÀNG
        </button>

        <p id="checkout-message" class="form-message"></p>

      </form>

    </div>


    <!-- ĐƠN HÀNG -->

    <div class="checkout-box">

      <h2>Đơn hàng của bạn</h2>

      <div id="checkout-items"></div>

      <div id="checkout-total" class="checkout-total">
      </div>

    </div>

  </div>

</main>


<script src="js/script.js"></script>

<script>

document.addEventListener('DOMContentLoaded', () => {

  updateCartCountUI();

  const cart = getCart();

  if(cart.length === 0){

    document.getElementById('checkout-items').innerHTML =
      '<p>Giỏ hàng đang trống.</p>';

    document.getElementById('checkout-form').style.display = 'none';

    return;
  }


  let total = 0;

  const html = cart.map(item => {

    const p = products.find(x => x.id === item.id);

    if(!p) return '';

    const subtotal = p.price * item.qty;

    total += subtotal;

    let variant = '';

    if(item.variant?.size){
      variant += `Size: ${item.variant.size}`;
    }

    if(item.variant?.color){
      variant += `Màu: ${item.variant.color}`;
    }

    return `
      <div class="order-item">

        <div>
          <strong>${p.title}</strong>

          <div>
            ${variant}
          </div>

          <div>
            ${formatVND(p.price)} × ${item.qty}
          </div>
        </div>

        <strong>
          ${formatVND(subtotal)}
        </strong>

      </div>
    `;

  }).join('');


  document.getElementById('checkout-items').innerHTML = html;

  document.getElementById('checkout-total').textContent =
    'Tổng cộng: ' + formatVND(total);


  document.getElementById('checkout-form')
    .addEventListener('submit', event => {

      event.preventDefault();

      const form = event.target;

      const customer = {
        name: form.name.value.trim(),
        phone: form.phone.value.trim(),
        address: form.address.value.trim(),
        payment: form.payment.value
      };


      const order = createOrder(customer);


      if(!order){
        return;
      }


      document.getElementById('checkout-message').className =
        'form-message success';

      document.getElementById('checkout-message').textContent =
        'Đặt hàng thành công! Mã đơn hàng: ' + order.id;


      setTimeout(() => {

        window.location.href =
          'lich-su-don-hang.html';

      }, 1200);

    });

});

</script>

</body>
</html>
