<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chi tiết sản phẩm — Fashion Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header container">
    <div class="logo">Fashion Store</div>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="cart.html">Giỏ hàng <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main class="container product-detail">
    <div id="product-root"></div>
  </main>

  <script src="js/script.js"></script>
  <script>
    // URL: product-detail.html?id=1
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('product-root').innerHTML = '<p>Không tìm thấy sản phẩm.</p>';
        return;
      }
      renderProductDetail(id, '#product-root');
      updateCartCountUI();
    });
  </script>
</body>
</html>
